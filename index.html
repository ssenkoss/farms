  .title-wrap h1 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 8px; }
  .status-line { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .header-actions, .stats, .card-foot-actions, .pass-row, .preview-strip, .note-thumbs, .modal-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  button:hover { border-color: var(--hover-border); background: var(--hover-btn); }

  button.report-btn { color: var(--med); border-color: rgba(255,183,77,.45); }
  button.report-btn:hover { background: rgba(255,183,77,.15); }
  button.danger { color: var(--crit); border-color: rgba(239,83,80,.4); }
  button.danger:hover { background: rgba(239,83,80,.15); }

  .dots-btn { padding: 8px 11px; font-size: 16px; line-height: 1; font-weight: 700; }
  .dots-menu { position: absolute; right: 0; top: calc(100% + 6px); background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px; min-width: 185px; display: none; flex-direction: column; gap: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.35); z-index: 60; }

// Работа с фото и Drag & Drop
function bindDrop(id, fn) {
const z = $(id);
["dragenter", "dragover"].forEach(ev => z.addEventListener(ev, e => { e.preventDefault(); z.classList.add("dragover"); }));
["dragleave", "drop"].forEach(ev => z.addEventListener(ev, e => { e.preventDefault(); z.classList.remove("dragover"); }));
z.addEventListener("drop", e => e.dataTransfer?.files.length && fn(e.dataTransfer.files));
}
bindDrop("coverDropZone", f => setCover(f[0]));
bindDrop("noteImgsDropZone", f => addNoteImgs(f));
function compress(file, maxW, q) {
return new Promise((res, rej) => {
const r = new FileReader();
r.onload = e => {
const img = new Image();
img.onload = () => {
let w = img.width, h = img.height;
if (w > maxW) { h = Math.round(h * (maxW / w)); w = maxW; }
const c = Object.assign(document.createElement("canvas"), { width: w, height: h });
c.getContext("2d").drawImage(img, 0, 0, w, h);
res(c.toDataURL("image/jpeg", q));
};
img.onerror = rej; img.src = e.target.result;
};
r.onerror = rej; r.readAsDataURL(file);
});
}
async function setCover(file) {
if (!file || !file.type.startsWith("image/")) return;
draftCover = await compress(file, 850, 0.72);
renderPreviews();
}
function handleCover(e) { setCover(e.target.files[0]); }
async function addNoteImgs(list) {
const files = Array.from(list).filter(f => f.type.startsWith("image/")).slice(0, 4 - draftImgs.length);
for (const f of files) draftImgs.push(await compress(f, 750, 0.68));
renderPreviews();
}
function handleNoteImgs(e) { addNoteImgs(e.target.files); e.target.value = ""; }
function renderPreviews() {
$("coverPreview").innerHTML = draftCover
? <div class="preview-item"><img src="${draftCover}"><button type="button" class="preview-del" onclick="draftCover='';$('fCoverInput').value='';renderPreviews()">×</button></div> : "";
$("noteImgsPreview").innerHTML = draftImgs.map((src, i) =>
<div class="preview-item"><img src="${src}"><button type="button" class="preview-del" onclick="draftImgs.splice(${i},1);renderPreviews()">×</button></div>
).join("");
}
// Облако JSONBin
async function syncCloud(method = "GET") {
const { binId, apiKey } = getCfg();
if (!binId || !apiKey) {
if (method === "GET") farms = JSON.parse(localStorage.getItem("clan_farms_local") || "[]");
else localStorage.setItem("clan_farms_local", JSON.stringify(farms));
setStatus("Режим: Локальное хранение (⋮ → Облако для общей базы)");
return render();
}
try {
setStatus(method === "GET" ? "Синхронизация с облаком..." : "Сохранение в облако...");
const url = https://jsonbin.io{binId}${method === "GET" ? "/latest" : ""};
const opt = { method, headers: { "X-Master-Key": apiKey } };
if (method === "PUT") { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(farms); }
const res = await fetch(url, opt);
if (!res.ok) throw new Error(Код ответа ${res.status});
if (method === "GET") {
const data = await res.json();
farms = Array.isArray(data.record) ? data.record : [];
}
setStatus(method === "GET" ? "Режим: Общая база клана подключена ✓" : "Сохранено в общую базу клана ✓");
render();
} catch (e) {
setStatus("Ошибка облака: " + e.message, true);
}
}

async function saveFarm() {
const name = $("fName").value.trim(), rate = $("fRate").value.trim();
if (!name || !rate) return alert("Заполните название фермы и ресы/ч!");
const old = editId !== null ? farms.find(x => String(x.id) === String(editId)) : null;
const item = {
id: editId !== null ? editId : Date.now(),
type: $("fType").value, name, dim: $("fDim").value,
x: $("fX").value || 0, y: $("fY").value || 64, z: $("fZ").value || 0,
rate, prio: $("fPrio").value, note: $("fNote").value.trim(),
author: $("fAuthor").value.trim() || "Не указан",
cover: draftCover, noteImgs: [...draftImgs],
reports: Array.isArray(old?.reports) ? old.reports : []
};
if (editId !== null) {
const idx = farms.findIndex(x => String(x.id) === String(editId));
if (idx !== -1) farms[idx] = item;
} else {
farms.unshift(item);
}
closeModal("addModal");
await syncCloud("PUT");
}

function openSonyaModal() {
$("dotsMenu").classList.remove("open");
askPass(getCfg().createPass, "📥 Доступ для Сони", "Введите пароль для добавления ферм:", () => {
$("sonyaCodeInput").value = "";
openModal("sonyaModal");
});

async function importSonyaCode() {
const lines = $("sonyaCodeInput").value.trim().split(/\r?\n/).map(l => l.trim()).filter(Boolean);
if (!lines.length) return alert("Вставьте хотя бы одну строку с кодом фермы!");
let count = 0;
lines.forEach((line, idx) => {
const p = line.split("@").map(s => s.trim());
if (p.length < 2) return;
const nums = (p[2] || "").match(/-?\d+(.\d+)?/g) || [];
const [x, y, z] = nums.length === 2 ? [Math.round(nums[0]), 64, Math.round(nums[1])]
: nums.length >= 3 ? [Math.round(nums[0]), Math.round(nums[1]), Math.round(nums[2])] :;
const d = (p[3] || "").toLowerCase(), pr = (p[5] || "").toLowerCase();
farms.unshift({
id: Date.now() + idx,
name: p[0] || "Без названия", rate: p[1] || "Не указано", x, y, z,
dim: p.length <= 4 ? "Верхний мир" : d.includes("незер") || d.includes("ад") ? "Незер" : d.includes("энд") ? "Энд" : "Верхний мир",
type: p.length <= 4 ? "Другое" : (p[4] || "Другое"),
prio: p.length <= 4 ? "med" : pr.includes("крит") ? "crit" : pr.includes("низ") ? "low" : "med",
author: p.length <= 4 ? "Не указан" : (p[6] || "Не указан"),
note: p.length <= 4 ? (p[3] || "") : p.slice(7).join("@"),
cover: "", noteImgs: [], reports: []
});
count++;
});
if (!count) return alert("Не удалось распознать код. Используйте разделитель @");
closeModal("sonyaModal");
await syncCloud("PUT");
}
// Репорты и удаление
function openReportModal(id) {
const f = farms.find(x => String(x.id) === String(id));
if (!f) return;
reportId = f.id;
$("reportFarmName").textContent = Ферма: ${f.name};
$("rAuthor").value = ""; $("rText").value = "";
openModal("reportModal");
}
async function submitReport() {
const text = $("rText").value.trim();
if (!text) return alert("Опишите, что именно сломалось!");
const idx = farms.findIndex(x => String(x.id) === String(reportId));
if (idx === -1) return;
if (!Array.isArray(farms[idx].reports)) farms[idx].reports = [];
const now = new Date();
const date = now.toLocaleDateString("ru-RU", { day: "2-digit", month: "2-digit" }) + " " + now.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
farms[idx].reports.push({ author: $("rAuthor").value.trim() || "Игрок", text, date });
closeModal("reportModal");
await syncCloud("PUT");
}
function clearReports(id) {
askPass(PASS_ADMIN, "🛠 Снятие репорта", "Введите пароль администратора:", async () => {
const idx = farms.findIndex(x => String(x.id) === String(id));
if (idx !== -1) { farms[idx].reports = []; await syncCloud("PUT"); }
});
}
function deleteFarm(id) {
askPass(PASS_ADMIN, "🗑 Удаление фермы", "Введите пароль администратора для удаления:", async () => {
if (!confirm("Точно удалить эту ферму из списка клана?")) return;
farms = farms.filter(x => String(x.id) !== String(id));
await syncCloud("PUT");
});
}

// Рендер карточек
const esc = s => String(s).replace(/[&<>"']/g, m => ({ "&": "&", "<": "<", ">": ">", '"': """, "'": "'" }[m]));
const openLightbox = src => { $("lightboxImg").src = src; openModal("lightbox"); };
function copyCoords(txt, btn) {
navigator.clipboard.writeText(txt);
const old = btn.textContent; btn.textContent = "Скопировано!";
setTimeout(() => btn.textContent = old, 1200);
}
function render() {
const q = $("searchInput").value.toLowerCase(), tf = $("typeFilter").value, pf = $("prioFilter").value;
$("statTotal").textContent = farms.length;
$("statBroken").textContent = farms.filter(f => f.reports?.length > 0).length;
$("statCrit").textContent = farms.filter(f => f.prio === "crit").length;
const prioMap = {
crit: ["🔴 Критичный риск поломки", "prio-crit"],
med:  ["🟡 Средний риск поломки", "prio-med"],
low:  ["🔵 Надёжная (низкий риск)", "prio-low"]
};
const list = farms.filter(f => {
const broken = f.reports?.length > 0;
if (tf && f.type !== tf) return false;
if (pf === "broken" && !broken) return false;
if (pf && pf !== "broken" && f.prio !== pf) return false;
return ${f.name} ${f.type} ${f.dim} ${f.x} ${f.y} ${f.z} ${f.note} ${f.author}.toLowerCase().includes(q);
});
$("farmsGrid").innerHTML = !list.length
? <div class="empty">Ферм по заданным фильтрам не найдено. Нажмите «+ Добавить ферму», чтобы создать первую запись.</div>
: list.map(f => {
const [pText, pCls] = prioMap[f.prio] || prioMap.low;
const coords = ${f.x} ${f.y} ${f.z}, reps = f.reports || [], broken = reps.length > 0;
return <div class="card ${broken ? "broken" : ""}"> ${broken ?
!ТРЕБУЕТСЯ РЕМОНТ (${reps.length})Ферма сломана! Смотрите репорт ниже.
✓ Починили
: ""} ${f.cover ?: ""} <div class="card-body"> <div> <div class="card-top"><span class="type-badge">${esc(f.type)}</span><span class="prio-badge ${pCls}">${pText}</span></div> <h3>${esc(f.name)}</h3> </div> ${broken ?🚨 Репорты о поломке:${reps.map(r => <div class="report-item"><b>${esc(r.author)}</b> (${esc(r.date || "")}): ${esc(r.text)}</div>).join("")}: ""} <div class="info-row"><span>🌍 ${esc(f.dim)}: <b class="coords">${esc(coords)}</b></span><button type="button" class="copy-btn" onclick="copyCoords('${esc(coords)}', this)">Копировать</button></div> <div class="info-row"><span>⚡ Ресы/ч:</span><b>${esc(f.rate)}</b></div> ${f.note ?${esc(f.note)}: ""} ${f.noteImgs?.length ?${f.noteImgs.map(s => <img class="note-thumb" src="${s}" onclick="openLightbox('${s}')">).join("")} : ""} </div> <div class="card-foot"> <span>Построил: <b>${esc(f.author)}</b></span> <div class="card-foot-actions"> <button type="button" class="sm-btn report-btn" onclick="openReportModal('${f.id}')">⚠ Репорт</button> <button type="button" class="sm-btn edit-btn" onclick="openEditModal('${f.id}')">Редактировать</button> <button type="button" class="sm-btn danger" onclick="deleteFarm('${f.id}')">Удалить</button> </div> </div> </div>;
}).join("");
}
