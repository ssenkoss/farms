<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Фермы клана — Minecraft</title>
<style>
  :root {
    --bg: #121512;
    --panel: #1b201b;
    --panel-2: #242b24;
    --border: #333e33;
    --text: #e6ede6;
    --note-text: #cdd8cd;
    --muted: #93a393;
    --green: #4caf50;
    --green-hover: #43a047;
    --crit: #ef5350;
    --med: #ffb74d;
    --low: #64b5f6;
    --hover-btn: #2c352c;
    --hover-border: #556855;
  }
  body.light-theme {
    --bg: #f1f4f1;
    --panel: #ffffff;
    --panel-2: #e6ece6;
    --border: #cbd5cb;
    --text: #182018;
    --note-text: #2c382c;
    --muted: #586958;
    --green: #2e7d32;
    --green-hover: #1b5e20;
    --crit: #d32f2f;
    --med: #e65100;
    --low: #1565c0;
    --hover-btn: #dce4dc;
    --hover-border: #9eb09e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
    transition: background 0.2s, color 0.2s;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
  }
  .title-wrap h1 {
    margin: 0;
    font-size: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .status-line {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }
  .header-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  button {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: 0.15s;
  }
  button:hover { border-color: var(--hover-border); background: var(--hover-btn); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.primary {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  button.primary:hover { background: var(--green-hover); }
  button.edit-btn {
    color: var(--low);
    border-color: rgba(100,181,246,0.45);
    padding: 5px 9px;
    font-size: 12px;
  }
  button.edit-btn:hover { background: rgba(100,181,246,0.15); }
  button.report-btn {
    color: var(--med);
    border-color: rgba(255,183,77,0.45);
    padding: 5px 9px;
    font-size: 12px;
  }
  button.report-btn:hover { background: rgba(255,183,77,0.15); }
  button.danger {
    color: var(--crit);
    border-color: rgba(239,83,80,0.4);
    padding: 5px 9px;
    font-size: 12px;
  }
  button.danger:hover { background: rgba(239,83,80,0.15); }

  .dots-wrap { position: relative; }
  .dots-btn {
    padding: 8px 11px;
    font-size: 16px;
    line-height: 1;
    font-weight: 700;
  }
  .dots-menu {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px;
    min-width: 185px;
    display: none;
    flex-direction: column;
    gap: 4px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    z-index: 60;
  }
  .dots-menu.open { display: flex; }
  .dots-menu button {
    width: 100%;
    text-align: left;
    padding: 7px 10px;
    font-size: 12.5px;
    border: none;
    background: transparent;
  }
  .dots-menu button:hover { background: var(--panel-2); }

  .container {
    max-width: 1150px;
    margin: 0 auto;
    padding: 20px 24px 60px;
  }
  .stats {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .stat-pill {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    color: var(--muted);
  }
  .stat-pill b { color: var(--text); }
  .stat-pill.crit b { color: var(--crit); }

  .filters {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  @media (max-width: 720px) {
    .filters { grid-template-columns: 1fr; }
  }
  input, select, textarea {
    width: 100%;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 9px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--green);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 16px;
  }
  .card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .card.broken {
    border-color: var(--crit);
    box-shadow: 0 0 0 1px rgba(239, 83, 80, 0.35), 0 8px 24px rgba(239, 83, 80, 0.14);
  }
  .broken-banner {
    background: rgba(239, 83, 80, 0.16);
    border-bottom: 1px solid rgba(239, 83, 80, 0.45);
    padding: 8px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .broken-left {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
  }
  .excl-icon {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: var(--crit);
    color: #fff;
    font-weight: 900;
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 10px rgba(239, 83, 80, 0.7);
    animation: pulseAlert 1.8s infinite;
  }
  @keyframes pulseAlert {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }
  .broken-info {
    font-size: 12px;
    color: var(--crit);
    line-height: 1.3;
  }
  .broken-info b {
    color: var(--text);
    display: block;
    font-size: 12.5px;
  }
  .fix-btn {
    flex-shrink: 0;
    background: rgba(76, 175, 80, 0.2);
    border: 1px solid rgba(76, 175, 80, 0.55);
    color: var(--green);
    padding: 4px 8px;
    font-size: 11px;
    border-radius: 5px;
    cursor: pointer;
    font-weight: 600;
  }
  .fix-btn:hover {
    background: var(--green);
    color: #fff;
  }

  .card-cover {
    width: 100%;
    height: 175px;
    object-fit: cover;
    display: block;
    background: #0d100d;
    border-bottom: 1px solid var(--border);
    cursor: zoom-in;
  }
  .card-body {
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .type-badge {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    padding: 3px 8px;
    border-radius: 4px;
    color: var(--muted);
  }
  .prio-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .prio-crit { background: rgba(239,83,80,0.16); color: var(--crit); border: 1px solid rgba(239,83,80,0.4); }
  .prio-med  { background: rgba(255,183,77,0.16); color: var(--med); border: 1px solid rgba(255,183,77,0.4); }
  .prio-low  { background: rgba(100,181,246,0.16); color: var(--low); border: 1px solid rgba(100,181,246,0.4); }

  .card h3 { margin: 4px 0 0; font-size: 17px; }
  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--panel-2);
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 13px;
    gap: 8px;
  }
  .coords {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12.5px;
  }
  .copy-btn { padding: 3px 8px; font-size: 11px; }
  .note {
    font-size: 13px;
    color: var(--note-text);
    background: rgba(128,128,128,0.06);
    border-left: 2px solid var(--border);
    padding: 6px 10px;
    border-radius: 0 4px 4px 0;
    white-space: pre-wrap;
  }
  .report-box {
    background: rgba(239, 83, 80, 0.08);
    border: 1px solid rgba(239, 83, 80, 0.35);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12.5px;
    color: var(--text);
  }
  .report-box-title {
    font-weight: 600;
    color: var(--crit);
    margin-bottom: 4px;
    font-size: 12px;
  }
  .report-item {
    border-top: 1px dashed rgba(239, 83, 80, 0.25);
    padding-top: 4px;
    margin-top: 4px;
    white-space: pre-wrap;
  }
  .report-item:first-of-type {
    border-top: none;
    padding-top: 0;
    margin-top: 0;
  }
  .note-thumbs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 2px;
  }
  .note-thumb {
    width: 64px;
    height: 48px;
    object-fit: cover;
    border-radius: 5px;
    border: 1px solid var(--border);
    cursor: zoom-in;
    transition: 0.15s;
  }
  .note-thumb:hover { border-color: var(--green); transform: scale(1.03); }

  .card-foot {
    padding: 10px 15px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
    gap: 6px;
    flex-wrap: wrap;
  }
  .card-foot-actions {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    width: 100%;
    max-width: 540px;
    max-height: 92vh;
    overflow-y: auto;
    padding: 20px;
  }
  .modal.modal-sm { max-width: 390px; }
  .modal h2 { margin: 0 0 14px; font-size: 18px; }
.form-group { margin-bottom: 12px; }
.form-group label {
display: block;
font-size: 12px;
color: var(--muted);
margin-bottom: 4px;
}
.pass-row { display: flex; gap: 6px; }
.pass-row input { flex: 1; }
.pass-eye { padding: 0 12px; font-size: 15px; }
.auth-err {
color: var(--crit);
font-size: 12px;
margin-top: 6px;
min-height: 16px;
}
.row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.file-box {
background: var(--panel-2);
border: 1px dashed #4a5a4a;
border-radius: 6px;
padding: 12px;
font-size: 12px;
transition: 0.15s;
cursor: pointer;
}
.file-box.dragover {
border-color: var(--green);
background: rgba(76, 175, 80, 0.12);
}
.drop-title { font-weight: 500; color: var(--text); margin-bottom: 2px; }
.file-box input[type="file"] { display: none; }
.preview-strip { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.preview-item { position: relative; width: 82px; height: 60px; }
.preview-item img {
width: 100%;
height: 100%;
object-fit: cover;
border-radius: 5px;
border: 1px solid var(--border);
background: #000;
}
.preview-del {
position: absolute;
top: -6px;
right: -6px;
background: var(--crit);
color: #fff;
border: none;
border-radius: 50%;
width: 20px;
height: 20px;
padding: 0;
font-size: 12px;
line-height: 20px;
text-align: center;
cursor: pointer;
z-index: 2;
}
.modal-actions {
display: flex;
justify-content: flex-end;
gap: 8px;
margin-top: 16px;
}
.empty {
grid-column: 1 / -1;
text-align: center;
padding: 40px;
color: var(--muted);
background: var(--panel);
border: 1px dashed var(--border);
border-radius: 10px;
}
.hint { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.code-example {
background: var(--panel-2);
border: 1px solid var(--border);
padding: 8px 10px;
border-radius: 6px;
font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
font-size: 11.5px;
color: var(--text);
margin-bottom: 10px;
white-space: pre-wrap;
word-break: break-word;
}
.lightbox {
position: fixed;
inset: 0;
background: rgba(0,0,0,0.88);
display: none;
align-items: center;
justify-content: center;
padding: 20px;
z-index: 100;
cursor: zoom-out;
}
.lightbox.open { display: flex; }
.lightbox img {
max-width: 95vw;
max-height: 92vh;
border-radius: 8px;
border: 1px solid var(--border);
box-shadow: 0 10px 40px rgba(0,0,0,0.8);
}
